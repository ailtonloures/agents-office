# Packaging of the desktop app (no code signing; auto-update only for the Linux AppImage, via GitHub Releases).
appId: dev.agentsoffice.desktop
productName: Agents Office
executableName: agents-office
copyright: MIT License
directories:
  output: release
  buildResources: resources
npmRebuild: false
asar: true
# Only the bundled main/preload go into the asar; the daemon is a separate directory because it
# is started as a child process and needs real files (and its own node_modules).
files:
  - package.json
  - dist/**
extraResources:
  - from: build/daemon
    to: daemon
    filter:
      - "**/*"
# electron-builder never copies node_modules through extraResources, so the daemon's production
# dependencies are added by this hook (see the file).
afterPack: scripts/after-pack.cjs
# node-pty is a native module: its .node/spawn-helper files must live on disk, not inside the asar.
asarUnpack:
  - "**/node_modules/node-pty/**"
linux:
  target: [AppImage, deb]
  category: Development
  icon: icon.png
  maintainer: Ailton Loures <dev.ailtonloures@proton.me>
  synopsis: Pixel art office that mirrors your Claude Code agents
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: icon.png
  identity: null
dmg:
  title: Agents Office
# Embeds app-update.yml in the app and, with --publish always, uploads the artifacts and latest-linux.yml
# to the GitHub Release of the pushed tag (see .github/workflows/release.yml).
publish:
  provider: github
  owner: ailtonloures
  repo: agents-office
  releaseType: release
artifactName: "agents-office-${version}-${os}-${arch}.${ext}"
