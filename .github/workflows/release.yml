name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Tag must match the desktop version
        run: |
          version="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/desktop version v${version}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Nothing is published here: the release only exists once every asset was built.
      - name: Build and package the AppImage and the deb
        working-directory: packages/desktop
        run: |
          pnpm --workspace-root build
          node scripts/stage-daemon.mjs
          pnpm exec electron-builder --config electron-builder.yml --linux AppImage deb --publish never
      - name: Check the expected assets exist
        working-directory: packages/desktop/release
        run: |
          for pattern in "*.AppImage" "*.deb" "latest-linux.yml"; do
            ls $pattern >/dev/null 2>&1 || { echo "Missing release asset: $pattern" >&2; exit 1; }
          done
          ls -l
      - name: Create the release with generated notes and attach the assets
        working-directory: packages/desktop/release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            *.AppImage *.deb latest-linux.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
