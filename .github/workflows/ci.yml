name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @agents-office/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @agents-office/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/test-results
            e2e/playwright-report

  desktop-linux:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agents-office/desktop dist
      - name: Desktop e2e on the packaged app (xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64
          xvfb-run -a pnpm --filter @agents-office/e2e exec playwright test desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-report
          path: |
            e2e/test-results
            e2e/playwright-report

  desktop-macos:
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unsigned build: no certificate, no notarization.
      - run: pnpm --filter @agents-office/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: packages/desktop/release/*.dmg
